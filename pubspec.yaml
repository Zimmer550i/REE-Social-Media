name: ree_social_media_app
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.6+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.2
  shared_preferences:
  flutter_svg:
  flutter_spinkit:
  flutter_otp_text_field:
  camera: ^0.11.2
  video_player: ^2.10.0
  path_provider:
  permission_handler: ^12.0.1
  flutter_sound:
  flutter_contacts:
  image_picker: ^1.2.0
  mime: ^2.0.0
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  socket_io_client: ^2.0.3
  uuid:
  gallery_saver_plus: ^3.2.9
  skeletonizer: ^2.1.0+1
  country_code_picker: ^3.4.1
  device_info_plus: ^12.1.0
  intl: ^0.20.2
  http: any
  video_thumbnail: ^0.5.6
  sms_autofill: ^2.4.1
  flutter_slidable: ^4.0.3
  onesignal_flutter: ^5.3.4
  app_badge_plus: ^1.2.6
  



dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true


  assets:
     - assets/icons/
     - assets/language/
     - assets/fonts/
     - assets/images/



  fonts:
      - family: Inter
        fonts:
          - asset: assets/fonts/inter.ttf

      - family: LibreText
        fonts:
          - asset: assets/fonts/LibreCaslonText-Regular.ttf

      - family: LibreDisplay
        fonts:
          - asset: assets/fonts/LibreCaslonDisplay-Regular.ttf


        

